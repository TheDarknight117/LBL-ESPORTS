<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equipos Oficiales | LBL 2026</title>
    <meta name="description" content="Conoce a las alineaciones y escuadras oficiales registradas en la Liga Boliviana de League of Legends (LBL) 2026.">
    
    <!-- OpenGraph (Facebook/Discord/WhatsApp) -->
    <meta property="og:title" content="Equipos Oficiales | LBL 2026">
    <meta property="og:description" content="Conoce a las alineaciones y escuadras oficiales registradas en la Liga Boliviana de League of Legends (LBL) 2026.">
    <meta property="og:image" content="https://lbl-esports.web.app/assets/SEO%20LBL%20etiqueta.png">
    <meta property="og:url" content="https://lbl-esports.web.app/equipos">
    <meta property="og:type" content="website">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Equipos Oficiales | LBL 2026">
    <meta name="twitter:description" content="Conoce a las alineaciones y escuadras oficiales registradas en la Liga Boliviana de League of Legends (LBL) 2026.">
    <meta name="twitter:image" content="https://lbl-esports.web.app/assets/SEO%20LBL%20etiqueta.png">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="assets/LBL Circular.png">
    <link rel="shortcut icon" type="image/png" href="assets/LBL Circular.png">
    <link rel="apple-touch-icon" href="assets/LBL Circular.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LBL Esports">

    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body { background-color: #020202; color: #e5e7eb; -webkit-tap-highlight-color: transparent; overflow-x: hidden; width: 100%; }
        
        .bg-grid { background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
        .glass-panel { background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-active-t1 { background-color: #eab308; color: #000; font-weight: 900; border-color: #eab308; box-shadow: 0 0 20px rgba(234,179,8,0.4); }
        .tab-active-t2 { background-color: #3b82f6; color: #fff; font-weight: 900; border-color: #3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.4); }
        .tab-inactive { background-color: rgba(255,255,255,0.05); color: #9ca3af; border-color: transparent; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="font-sans antialiased bg-grid min-h-screen flex flex-col relative">

    <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

    <nav class="w-full glass-panel sticky top-0 z-40 px-4 md:px-8 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <img src="assets/logo.png" onerror="this.src='https://ui-avatars.com/api/?name=LBL&background=0D0D0D&color=3B82F6'" alt="LBL" class="h-10 w-auto object-contain">
            <span class="text-xl font-black tracking-widest uppercase italic hidden sm:block"><span class="text-blue-500">LBL</span></span>
            <span id="staff-badge" class="hidden items-center gap-1.5 px-3 py-1 rounded-full bg-red-600/20 text-red-500 border border-red-500/30 text-[10px] font-black uppercase tracking-widest animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.2)] ml-2">
                <i class="fas fa-shield-alt"></i> Staff View
            </span>
        </a>
        <a href="/" class="text-gray-400 hover:text-white font-bold text-sm transition-colors py-2"><i class="fas fa-home mr-1"></i> Inicio</a>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 pt-10 pb-20">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black uppercase italic tracking-tighter mb-4"><span class="text-blue-500">ROSTERS</span> OFICIALES</h1>
            <p class="text-gray-400 text-sm max-w-2xl mx-auto">Conoce a los equipos aceptados en la LBL. Contacta a los representantes para organizar scrims y mira las estadísticas de los jugadores.</p>
        </div>

        <div class="flex justify-center gap-3 sm:gap-4 mb-12 px-2">
            <button id="btn-t1" onclick="cambiarTier('Tier 1')" class="px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-active-t1 flex items-center gap-2 whitespace-nowrap">
                <i class="fas fa-trophy"></i> TIER 1
            </button>
            <button id="btn-t2" onclick="cambiarTier('Tier 2')" class="px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-inactive flex items-center gap-2 hover:bg-white/10 whitespace-nowrap">
                <i class="fas fa-level-up-alt"></i> TIER 2
            </button>
        </div>

        <div id="loading-spinner" class="text-center py-20 text-blue-500">
            <i class="fas fa-circle-notch fa-spin text-5xl mb-4"></i>
            <p class="font-bold tracking-widest uppercase text-sm">Cargando base de datos...</p>
        </div>

        <div id="teams-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            </div>

        <div id="empty-state" class="text-center py-20 hidden">
            <i class="fas fa-ghost text-6xl text-gray-800 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-500">Aún no hay equipos aceptados en este Tier.</h3>
        </div>
    </main>

    <div id="team-modal" class="fixed inset-0 bg-black/95 z-50 hidden items-center justify-center p-2 md:p-4 backdrop-blur-md">
        <div class="bg-[#050505] border border-gray-800 rounded-3xl max-w-3xl w-full max-h-[95vh] flex flex-col relative shadow-2xl shadow-blue-900/20">
            
            <button onclick="cerrarModal()" class="absolute top-4 right-4 w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-red-500 transition-colors z-10 border border-gray-700">
                <i class="fas fa-times"></i>
            </button>

            <div id="modal-header" class="p-6 md:p-8 border-b border-gray-800 flex flex-col md:flex-row items-start md:items-center gap-6 shrink-0 relative overflow-hidden rounded-t-3xl">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-900/20 to-transparent -z-10"></div>
                <img id="modal-logo" src="" class="w-20 h-20 md:w-28 md:h-28 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.1)] rounded-xl bg-black/50 p-2 border border-gray-800 shrink-0">
                <div class="w-full min-w-0">
                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                        <span id="modal-tier" class="text-[10px] font-black tracking-widest px-2.5 py-0.5 rounded bg-blue-600/20 text-blue-400 border border-blue-500/30 uppercase">Tier</span>
                        <span id="modal-tag" class="text-[10px] font-black tracking-widest px-2.5 py-0.5 rounded bg-gray-800 text-gray-300 uppercase">TAG</span>
                    </div>
                    <h2 id="modal-name" class="text-2xl md:text-3xl font-black uppercase italic tracking-tighter text-white mb-2 truncate">Nombre</h2>
                    
                    <div id="modal-rep" class="flex flex-wrap gap-2 mb-2"></div>
                    <div id="modal-socials" class="flex flex-wrap gap-2 mb-3"></div>

                    <!-- LAYER: MOVIMIENTOS & FICHAJES CON MENÚ FLOTANTE HORIZONTAL -->
                    <div id="modal-liquipedia-layer" class="hidden flex-col gap-2.5 pt-3.5 mt-2 border-t border-gray-800/80 w-full relative">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center gap-2.5 flex-wrap" id="modal-moves-buttons-container">
                                <!-- Botones flotantes: Fichajes (Verde) y Movimientos (Celeste) -->
                            </div>
                            <span id="modal-moves-date" class="text-gray-500 font-mono text-[10px]">Última act.</span>
                        </div>
                        <!-- MENÚ FLOTANTE HORIZONTAL -->
                        <div id="modal-moves-dropdown-container" class="hidden flex-col gap-2 p-3 bg-[#030712]/95 backdrop-blur-xl rounded-2xl transition-all shadow-2xl z-30 overflow-hidden" style="border: 1.5px solid rgba(255, 255, 255, 0.1) !important;">
                            <div id="modal-moves-badges" class="flex flex-row flex-nowrap items-center gap-3 overflow-x-auto py-1 max-w-full scrollbar-thin">
                                <!-- Badges horizontales inyectados al desplegar -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="modal-roster" class="p-6 md:p-8 overflow-y-auto flex-grow space-y-8">
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "/firebase-config.js"; 
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let todosLosEquipos = [];
        let tierActual = 'Tier 1';
        
        const urlParams = new URLSearchParams(window.location.search);
        const tierParam = urlParams.get('tier');
        if (tierParam) {
            if (tierParam.toLowerCase().includes('2')) {
                tierActual = 'Tier 2';
            } else if (tierParam.toLowerCase().includes('1')) {
                tierActual = 'Tier 1';
            }
        }
        
        const roleIcons = {
            'TOP': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-top.svg',
            'JG': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-jungle.svg',
            'MID': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-middle.svg',
            'ADC': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-bottom.svg',
            'SUPP': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-utility.svg',
            'SUPLENTE': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-fill.svg',
            'COACH': 'fas fa-chalkboard-user'
        };

        // 1. CARGAR DATOS
        async function cargarEquipos() {
            try {
                const q = query(collection(db, "inscripciones_pendientes"), where("estado", "==", "Aceptado"));
                const querySnapshot = await getDocs(q);
                todosLosEquipos = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    todosLosEquipos.push({ id: doc.id, ...data });
                });
                document.getElementById('loading-spinner').classList.add('hidden');
                cambiarTier(tierActual);
            } catch (error) {
                console.error(error);
                document.getElementById('loading-spinner').innerHTML = `<p class="text-red-500 font-bold">Error de conexión.</p>`;
            }
        }

        // 2. RENDERIZAR TARJETAS EN PANTALLA
        function renderizarGrilla(tier) {
            const grid = document.getElementById('teams-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const equiposFiltrados = todosLosEquipos.filter(eq => eq.equipo?.tier === tier);

            if (equiposFiltrados.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            equiposFiltrados.forEach(eq => {
                const rep1 = (eq.representantes && eq.representantes.length > 0) ? eq.representantes[0] : null;
                const repName = rep1 ? rep1.nombre : 'Staff';
                const repTelDisplay = rep1 && rep1.tel ? rep1.tel : 'Sin número';
                const repTelLink = rep1 && rep1.tel ? rep1.tel.replace(/[^0-9]/g, '') : '';
                
                const btnWapp = repTelLink 
                    ? `<button onclick="event.stopPropagation(); window.open('https://wa.me/${repTelLink}', '_blank')" class="text-green-400 hover:text-white bg-green-900/20 hover:bg-green-600 px-3 py-1.5 rounded-lg text-[10px] uppercase font-black transition-all border border-green-800 hover:border-green-500"><i class="fab fa-whatsapp text-sm mr-1"></i> Contactar</button>` 
                    : '';

                const card = document.createElement('div');
                card.className = "glass-panel rounded-3xl p-5 text-center group cursor-pointer hover:-translate-y-2 hover:bg-[#111] transition-all duration-300 relative overflow-hidden fade-in flex flex-col justify-between";
                const borderColor = tier === 'Tier 1' ? 'border-yellow-500/50' : 'border-blue-500/50';
                card.classList.add('border-t-4', borderColor);

                const logoAUsar = eq.equipo.logo || "https://ui-avatars.com/api/?name=" + eq.equipo.nombre + "&background=0D0D0D&color=fff";

                card.innerHTML = `
                    <div class="flex justify-between items-center w-full mb-4">
                        <span class="text-[10px] font-black uppercase px-2 py-1 rounded bg-[#050505] text-gray-300 border border-gray-800">${eq.equipo.tier}</span>
                        ${btnWapp}
                    </div>
                    <div class="w-24 h-24 mx-auto mb-4 bg-black p-2 rounded-2xl border border-gray-800 group-hover:border-gray-600 transition-colors shadow-inner">
                        <img src="${logoAUsar}" onerror="this.src='https://ui-avatars.com/api/?name=${eq.equipo.nombre}&background=0D0D0D&color=fff'" class="w-full h-full object-contain drop-shadow-lg">
                    </div>
                    <h3 class="text-xl font-black uppercase tracking-tight mb-2 truncate px-2 text-white">${eq.equipo.nombre}</h3>
                    
                    <div class="mb-5 bg-[#050505] border border-gray-800/50 rounded-lg py-2 px-1">
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest"><i class="fas fa-user-tie"></i> ${repName}</p>
                        <p class="text-xs text-green-400 font-black mt-0.5"><i class="fab fa-whatsapp"></i> ${repTelDisplay}</p>
                    </div>
                    
                    <div class="w-full bg-blue-600/10 border border-blue-900/50 text-blue-400 text-xs font-black px-4 py-3 rounded-xl uppercase tracking-widest group-hover:bg-blue-600 group-hover:text-white transition-all">
                        VER ROSTER COMPLETO
                    </div>
                `;

                card.onclick = () => abrirModal(eq);
                grid.appendChild(card);
            });
        }

        window.cambiarTier = (tier) => {
            tierActual = tier;
            document.getElementById('btn-t1').className = tier === 'Tier 1' ? "px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-active-t1 flex items-center gap-2 whitespace-nowrap" : "px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-inactive flex items-center gap-2 hover:bg-white/10 whitespace-nowrap";
            document.getElementById('btn-t2').className = tier === 'Tier 2' ? "px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-active-t2 flex items-center gap-2 whitespace-nowrap" : "px-4 sm:px-8 py-2.5 sm:py-3 text-xs sm:text-base rounded-xl sm:rounded-2xl border transition-all tab-inactive flex items-center gap-2 hover:bg-white/10 whitespace-nowrap";
            renderizarGrilla(tier);
        };

        // 4. GENERADOR SEGURO DE JUGADORES
        function crearFilaJugador(rolNombre, iconKey, jugadorData, isCapitan = false) {
            if (!jugadorData || !jugadorData.riotId) return '';

            const isFontAwesome = iconKey.includes('fas ');
            const iconHTML = isFontAwesome ? `<i class="${iconKey} text-gray-500 text-2xl w-8 text-center drop-shadow-md"></i>` : `<img src="${iconKey}" class="w-8 h-8 object-contain opacity-90 drop-shadow-md" alt="${rolNombre}">`;
            const badgeCapitan = isCapitan ? `<span class="bg-yellow-500 text-black text-[9px] font-black px-2 py-0.5 rounded uppercase ml-2 shadow-[0_0_10px_rgba(234,179,8,0.5)]">CAPITÁN</span>` : '';

            let linkSecundarioHTML = '';
            if(jugadorData.cuenta_secundaria && jugadorData.cuenta_secundaria.riotId2) {
                linkSecundarioHTML = `<a href="${jugadorData.cuenta_secundaria.opgg2}" target="_blank" class="text-[11px] text-purple-400 hover:text-purple-300 font-bold block mt-1"><i class="fas fa-link mr-1"></i> ${jugadorData.cuenta_secundaria.riotId2} (${jugadorData.cuenta_secundaria.servidor.toUpperCase()})</a>`;
            }

            return `
                <div class="flex items-center justify-between p-4 bg-[#070c14] rounded-2xl transition-colors shadow-lg hover:bg-[#0a1220]" style="border: 1px solid rgba(255, 255, 255, 0.08) !important;">
                    <div class="flex items-center gap-4 min-w-0">
                        <div class="bg-[#030712] p-2.5 rounded-xl flex items-center justify-center shrink-0" style="border: 1px solid rgba(255, 255, 255, 0.06) !important;">
                            ${iconHTML}
                        </div>
                        <div class="min-w-0">
                            <p class="text-[10px] text-gray-400 font-black tracking-widest uppercase mb-0.5">${rolNombre} ${badgeCapitan}</p>
                            <p class="text-white font-bold text-sm md:text-base tracking-tight truncate">${jugadorData.riotId}</p>
                            ${linkSecundarioHTML}
                        </div>
                    </div>
                    <a href="${jugadorData.opgg}" target="_blank" class="bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500 hover:text-black w-11 h-11 rounded-xl flex items-center justify-center transition-all shrink-0 text-base shadow-inner ml-2" style="border: 1px solid rgba(6, 182, 212, 0.3) !important;" title="Ver OP.GG">
                        <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>
            `;
        }

        // 5. ABRIR MODAL
        window.abrirModal = (equipo) => {
            const modal = document.getElementById('team-modal');
            document.getElementById('modal-logo').src = equipo.equipo.logo || "https://ui-avatars.com/api/?name=" + equipo.equipo.nombre + "&background=0D0D0D&color=fff";
            document.getElementById('modal-name').innerText = equipo.equipo.nombre;
            document.getElementById('modal-tier').innerText = equipo.equipo.tier;

            const tagEl = document.getElementById('modal-tag');
            if (tagEl) {
                tagEl.innerText = equipo.equipo.tag ? `[${equipo.equipo.tag}]` : '';
                tagEl.style.display = equipo.equipo.tag ? 'inline-block' : 'none';
            }

            // Inyectar Representantes EXPLÍCITAMENTE en el Modal (Diseño inicial)
            let repsInfoHTML = '';
            if (equipo.representantes && equipo.representantes.length > 0) {
                equipo.representantes.forEach((rep, idx) => {
                    if (rep.nombre && rep.tel) {
                        const numLink = rep.tel.replace(/[^0-9]/g, '');
                        repsInfoHTML += `
                            <div class="text-[11px] font-bold text-gray-300 bg-[#0a0a0a] px-3 py-2 rounded-xl border border-gray-700 flex items-center gap-2">
                                <i class="fas fa-user-tie text-gray-500"></i> 
                                ${rep.nombre} 
                                <a href="https://wa.me/${numLink}" target="_blank" class="text-green-400 hover:text-green-300 ml-1 bg-green-900/20 px-2 py-0.5 rounded border border-green-800 transition-colors">
                                    <i class="fab fa-whatsapp"></i> ${rep.tel}
                                </a>
                            </div>`;
                    }
                });
            }
            document.getElementById('modal-rep').innerHTML = repsInfoHTML;

            // Redes Sociales del Equipo (Diseño inicial)
            let redesHTML = '';
            if (equipo.media?.streamer_link) redesHTML += `<a href="${equipo.media.streamer_link}" target="_blank" class="text-blue-400 hover:text-white bg-blue-900/20 px-3 py-1.5 rounded-lg border border-blue-900/50 text-xs font-bold transition-colors"><i class="fas fa-video mr-1"></i> Stream</a>`;
            if (equipo.media?.ig) redesHTML += `<a href="https://instagram.com/${equipo.media.ig.replace('@','')}" target="_blank" class="text-pink-400 hover:text-white bg-pink-900/20 px-3 py-1.5 rounded-lg border border-pink-900/50 text-xs font-bold transition-colors"><i class="fab fa-instagram mr-1"></i> Instagram</a>`;
            document.getElementById('modal-socials').innerHTML = redesHTML;

            // LAYER DE MOVIMIENTOS & FICHAJES (DOS BOTONES DESPLEGABLES: FICHAJES [VERDE] & MOVIMIENTOS [CELESTE])
            const liquiLayer = document.getElementById('modal-liquipedia-layer');
            const movesBtnContainer = document.getElementById('modal-moves-buttons-container');
            const movesDropdown = document.getElementById('modal-moves-dropdown-container');
            const movesDate = document.getElementById('modal-moves-date');
            
            window.modalFichajesCache = [];
            window.modalMovimientosCache = [];
            window.activeMovesTab = null;

            if (equipo.historial_ediciones && equipo.historial_ediciones.length > 0) {
                const ultEvento = equipo.historial_ediciones[0];
                const fechaFormat = new Date(ultEvento.fecha).toLocaleDateString('es-BO', { day: '2-digit', month: 'short' });
                movesDate.innerText = `Act. ${fechaFormat}`;
                
                const fichajes = [];
                const movimientos = [];

                if (Array.isArray(ultEvento.cambios)) {
                    ultEvento.cambios.forEach(c => {
                        if (c.tipoCambio === 'fichaje') {
                            fichajes.push(c);
                        } else {
                            movimientos.push(c);
                        }
                    });
                }

                window.modalFichajesCache = fichajes;
                window.modalMovimientosCache = movimientos;

                let btnsHTML = '';
                if (fichajes.length > 0) {
                    btnsHTML += `
                        <button type="button" onclick="toggleMovesPanel('fichajes')" id="btn-tab-fichajes" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-950/60 text-emerald-300 hover:bg-emerald-900/80 active:scale-95 transition-all flex items-center gap-2 shadow-sm cursor-pointer" style="border: 1px solid rgba(16, 185, 129, 0.5) !important;">
                            <i class="fas fa-user-plus text-emerald-400 text-xs"></i> 
                            <span>Fichajes (${fichajes.length})</span>
                            <i id="icon-tab-fichajes" class="fas fa-chevron-down text-[10px] text-emerald-400 transition-transform"></i>
                        </button>`;
                }

                if (movimientos.length > 0) {
                    btnsHTML += `
                        <button type="button" onclick="toggleMovesPanel('movimientos')" id="btn-tab-movimientos" class="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-950/60 text-cyan-300 hover:bg-cyan-900/80 active:scale-95 transition-all flex items-center gap-2 shadow-sm cursor-pointer" style="border: 1px solid rgba(6, 182, 212, 0.5) !important;">
                            <i class="fas fa-arrows-rotate text-cyan-400 text-xs"></i> 
                            <span>Movimientos (${movimientos.length})</span>
                            <i id="icon-tab-movimientos" class="fas fa-chevron-down text-[10px] text-cyan-400 transition-transform"></i>
                        </button>`;
                }

                if (btnsHTML) {
                    movesBtnContainer.innerHTML = btnsHTML;
                    movesDropdown.classList.add('hidden');
                    movesDropdown.classList.remove('flex');
                    liquiLayer.classList.remove('hidden');
                    liquiLayer.classList.add('flex');
                } else {
                    liquiLayer.classList.add('hidden');
                    liquiLayer.classList.remove('flex');
                }
            } else {
                liquiLayer.classList.add('hidden');
                liquiLayer.classList.remove('flex');
            }

            const r = equipo.roster || {};
            
            // SECCIÓN: TITULARES
            let rosterHTML = `
                <div>
                    <h4 class="text-sm font-black text-yellow-500 uppercase tracking-widest mb-3 border-b border-gray-800 pb-2 flex items-center gap-2"><i class="fas fa-gamepad text-yellow-500"></i> Roster Titular</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        ${crearFilaJugador('Top', roleIcons['TOP'], r.TOP, equipo.capitan === 'TOP')}
                        ${crearFilaJugador('Jungla', roleIcons['JG'], r.JG, equipo.capitan === 'JG')}
                        ${crearFilaJugador('Mid', roleIcons['MID'], r.MID, equipo.capitan === 'MID')}
                        ${crearFilaJugador('ADC', roleIcons['ADC'], r.ADC, equipo.capitan === 'ADC')}
                        ${crearFilaJugador('Soporte', roleIcons['SUPP'], r.SUPP, equipo.capitan === 'SUPP')}
                    </div>
                </div>`;

            // SECCIÓN: SUPLENTES
            if (equipo.suplentes && equipo.suplentes.length > 0) {
                rosterHTML += `
                <div class="mt-8">
                    <h4 class="text-sm font-black text-teal-400 uppercase tracking-widest mb-3 border-b border-gray-800 pb-2 flex items-center gap-2"><i class="fas fa-user-clock text-teal-400"></i> Suplentes Autorizados</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">`;
                equipo.suplentes.forEach(sup => {
                    let iconCode = 'SUPLENTE';
                    if (sup.rol_seleccionado) {
                        if(sup.rol_seleccionado.includes('TOP')) iconCode = 'TOP';
                        else if(sup.rol_seleccionado.includes('JG')) iconCode = 'JG';
                        else if(sup.rol_seleccionado.includes('MID')) iconCode = 'MID';
                        else if(sup.rol_seleccionado.includes('ADC')) iconCode = 'ADC';
                        else if(sup.rol_seleccionado.includes('SUPP')) iconCode = 'SUPP';
                    }
                    rosterHTML += crearFilaJugador(`Suplente (${sup.rol_seleccionado || 'Fill'})`, roleIcons[iconCode], sup);
                });
                rosterHTML += `</div></div>`;
            }

            // SECCIÓN: COACHES
            if (equipo.coaches && equipo.coaches.length > 0) {
                rosterHTML += `
                <div class="mt-8">
                    <h4 class="text-sm font-black text-rose-400 uppercase tracking-widest mb-3 border-b border-gray-800 pb-2 flex items-center gap-2"><i class="fas fa-chalkboard-user text-rose-400"></i> Staff Técnico</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">`;
                equipo.coaches.forEach(coach => {
                    rosterHTML += crearFilaJugador('Coach Estratégico', roleIcons['COACH'], coach);
                });
                rosterHTML += `</div></div>`;
            }

            // SECCIÓN: EX-JUGADORES (HISTORIAL DE INTEGRANTES)
            if (equipo.ex_jugadores && equipo.ex_jugadores.length > 0) {
                rosterHTML += `
                <div class="mt-8 border-t border-gray-800/80 pt-6">
                    <h4 class="text-sm font-black text-rose-400 uppercase tracking-widest mb-4 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fas fa-history text-rose-500"></i> Ex-Jugadores del Equipo</span>
                        <span class="text-xs text-gray-400 font-bold bg-[#070c14] px-3 py-1 rounded-xl" style="border: 1px solid rgba(255, 255, 255, 0.08) !important;">${equipo.ex_jugadores.length} ex-integrante(s)</span>
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">`;
                equipo.ex_jugadores.forEach(ex => {
                    const fechaSal = new Date(ex.fechaSalida).toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
                    rosterHTML += `
                        <div class="p-4 bg-[#0a0507]/90 rounded-2xl flex flex-col justify-between gap-2.5 shadow-md hover:bg-[#12070a] transition-colors" style="border: 1px solid rgba(244, 63, 94, 0.25) !important;">
                            <div class="flex items-center justify-between gap-2 pt-0.5">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="font-black text-gray-100 text-sm tracking-tight truncate">${ex.riotId}</span>
                                </div>
                                <span class="text-[10px] font-black px-2 py-0.5 rounded-md bg-rose-950/60 text-rose-300 border border-rose-500/30 uppercase shrink-0">${ex.rol || 'Jugador'}</span>
                            </div>
                            <p class="text-xs text-gray-400 font-medium">${ex.nombre || 'Nombre no registrado'}</p>
                            <div class="pt-2 mt-0.5 border-t border-rose-950/50 flex items-center justify-between text-[11px]">
                                <span class="text-rose-400 font-bold flex items-center gap-1.5">
                                    <i class="fas fa-arrow-right-from-bracket text-rose-400 text-[10px]"></i> ${ex.motivo || 'Baja de Roster'}
                                </span>
                                <span class="text-gray-500 text-[10px] font-mono">${fechaSal}</span>
                            </div>
                        </div>`;
                });
                rosterHTML += `</div></div>`;
            }

            document.getElementById('modal-roster').innerHTML = rosterHTML;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        };

        window.cerrarModal = () => {
            document.getElementById('team-modal').classList.add('hidden');
            document.getElementById('team-modal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        };

        function extraerSoloRiotId(val) {
            if (!val) return '';
            const s = val.toString().trim();
            const idx = s.indexOf('(');
            if (idx !== -1) {
                return s.slice(0, idx).trim();
            }
            return s;
        }

        window.toggleMovesPanel = (tab) => {
            const dropdown = document.getElementById('modal-moves-dropdown-container');
            const badgesContainer = document.getElementById('modal-moves-badges');
            const iconFichajes = document.getElementById('icon-tab-fichajes');
            const iconMovimientos = document.getElementById('icon-tab-movimientos');
            const btnFichajes = document.getElementById('btn-tab-fichajes');
            const btnMovimientos = document.getElementById('btn-tab-movimientos');

            // Reset icons
            if (iconFichajes) iconFichajes.style.transform = 'rotate(0deg)';
            if (iconMovimientos) iconMovimientos.style.transform = 'rotate(0deg)';
            if (btnFichajes) btnFichajes.style.backgroundColor = '';
            if (btnMovimientos) btnMovimientos.style.backgroundColor = '';

            if (window.activeMovesTab === tab) {
                // Cerrar
                dropdown.classList.add('hidden');
                dropdown.classList.remove('flex');
                window.activeMovesTab = null;
                return;
            }

            window.activeMovesTab = tab;
            dropdown.classList.remove('hidden');
            dropdown.classList.add('flex');

            let html = '';
            if (tab === 'fichajes') {
                if (iconFichajes) iconFichajes.style.transform = 'rotate(180deg)';
                if (btnFichajes) btnFichajes.style.backgroundColor = 'rgba(16, 185, 129, 0.25)';
                dropdown.style.borderColor = 'rgba(16, 185, 129, 0.45)';

                window.modalFichajesCache.forEach(c => {
                    const nickOnly = extraerSoloRiotId(c.nuevo);
                    html += `
                        <div class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-[#061e16] text-emerald-300 shrink-0 shadow-lg whitespace-nowrap" style="border: 1.5px solid rgba(16, 185, 129, 0.4) !important;">
                            <i class="fas fa-user-plus text-emerald-400 text-xs"></i> 
                            <span class="text-emerald-400 font-black tracking-wider text-xs">FICHAJE:</span> 
                            <span class="text-white font-bold text-xs">${nickOnly}</span> 
                            <span class="text-emerald-300 text-[11px] font-bold bg-emerald-950/80 px-2 py-0.5 rounded-lg border border-emerald-500/30">${c.campo || 'Roster'}</span>
                        </div>`;
                });
            } else if (tab === 'movimientos') {
                if (iconMovimientos) iconMovimientos.style.transform = 'rotate(180deg)';
                if (btnMovimientos) btnMovimientos.style.backgroundColor = 'rgba(6, 182, 212, 0.25)';
                dropdown.style.borderColor = 'rgba(6, 182, 212, 0.45)';

                window.modalMovimientosCache.forEach(c => {
                    if (c.tipoCambio === 'reemplazo') {
                        const cleanDetalle = c.detalle ? c.detalle : `<span class="text-white font-bold">${extraerSoloRiotId(c.nuevo)}</span> en <span class="text-cyan-300 font-bold">${c.campo}</span>`;
                        html += `
                            <div class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-[#071c26] text-cyan-300 shrink-0 shadow-lg whitespace-nowrap" style="border: 1.5px solid rgba(6, 182, 212, 0.4) !important;">
                                <i class="fas fa-arrows-rotate text-cyan-400 text-xs"></i> 
                                <span class="text-white font-bold text-xs">${cleanDetalle}</span>
                            </div>`;
                    } else if (c.tipoCambio === 'cambio_nombre') {
                        html += `
                            <div class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-purple-950/60 text-purple-300 shrink-0 shadow-lg whitespace-nowrap" style="border: 1.5px solid rgba(168, 85, 247, 0.4) !important;">
                                <i class="fas fa-sync-alt text-purple-400 text-xs"></i> 
                                <span class="text-purple-400 font-black text-xs">RENOMBRE:</span> <span class="text-white font-bold text-xs">${extraerSoloRiotId(c.anterior)}</span> ➔ <span class="text-purple-300 font-bold text-xs">${extraerSoloRiotId(c.nuevo)}</span>
                            </div>`;
                    } else if (c.tipoCambio === 'transferencia') {
                        html += `
                            <div class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-amber-950/60 text-amber-300 shrink-0 shadow-lg whitespace-nowrap" style="border: 1.5px solid rgba(245, 158, 11, 0.4) !important;">
                                <i class="fas fa-arrow-right-arrow-left text-amber-400 text-xs"></i> 
                                <span class="text-amber-400 font-black text-xs">TRASPASO:</span> <span class="text-white font-bold text-xs">${extraerSoloRiotId(c.nuevo)}</span> <span class="text-amber-300 text-[11px] font-bold bg-amber-950 px-2 py-0.5 rounded-lg border border-amber-500/30">(${extraerSoloRiotId(c.anterior)})</span>
                            </div>`;
                    } else if (c.tipoCambio === 'baja') {
                        html += `
                            <div class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-rose-950/60 text-rose-300 shrink-0 shadow-lg whitespace-nowrap" style="border: 1.5px solid rgba(244, 63, 94, 0.4) !important;">
                                <i class="fas fa-user-minus text-rose-400 text-xs"></i> 
                                <span class="text-rose-400 font-black text-xs">BAJA:</span> <span class="text-gray-200 font-bold text-xs">${extraerSoloRiotId(c.anterior)}</span>
                            </div>`;
                    }
                });
            }

            badgesContainer.innerHTML = html || `<p class="text-xs text-gray-500 italic p-2 whitespace-nowrap">Sin registros en esta sección.</p>`;
        };

        cargarEquipos();

        window.addEventListener('load', () => {
            const isStaff = localStorage.getItem('lbl_staff_logged_in') === 'true';
            const staffBadge = document.getElementById('staff-badge');
            if (isStaff && staffBadge) {
                staffBadge.classList.remove('hidden');
                staffBadge.classList.add('inline-flex');
            }
        });
    </script>
    
    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
